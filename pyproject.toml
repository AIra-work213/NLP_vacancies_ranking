[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "nlp-ranking"
version = "0.1.0"
description = "Поиск и ранжирование текстов с воспроизводимыми ML-процессами"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.133,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.7,<3",
  "prometheus-client>=0.21,<1",
  "PyYAML>=6.0,<7",
  "SQLAlchemy[asyncio]>=2.0,<2.1",
  "asyncpg>=0.30,<1",
  "alembic>=1.14,<2",
  "pgvector>=0.4,<1",
  "redis>=5,<9",
  "minio>=7.2,<8",
  "urllib3>=2,<3",
  "structlog>=25,<27",
  "prometheus-fastapi-instrumentator>=8.1,<9",
]

[project.optional-dependencies]
serving = [
  "torch>=2.6,<3",
  "transformers>=4.48,<6",
  "sentence-transformers>=3.4,<6",
  "bm25s>=0.2,<1",
  "pyarrow>=19,<24",
]
tracking = ["mlflow>=3.0,<4"]
ml = [
  "torch>=2.6,<3",
  "transformers>=4.48,<6",
  "sentence-transformers>=3.4,<6",
  "mlflow>=3.0,<4",
  "dvc[s3]>=3.67.1,<4",
  "bm25s>=0.2,<1",
  "scikit-learn>=1.7,<2",
  "pandas>=2.2,<4",
  "pyarrow>=19,<24",
  "ranx>=0.3,<1",
]
demo = ["streamlit>=1.42,<2", "httpx>=0.28,<1"]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=1,<2",
  "pytest-cov>=6,<8",
  "httpx>=0.28,<1",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "types-PyYAML>=6,<7",
  "locust>=2.32,<3",
]

[project.scripts]
nlp-ranker-pipeline = "nlp_ranker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nlp_ranker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: требует внешних сервисов"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
ignore = ["D400"]
select = ["E", "W", "F", "I", "N", "D", "UP", "B", "SIM"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.mypy]
python_version = "3.12"
files = ["src/nlp_ranker"]
strict = true

[[tool.mypy.overrides]]
module = [
  "sentence_transformers", "sentence_transformers.*",
  "mlflow", "mlflow.*", "streamlit", "streamlit.*",
  "ranx", "ranx.*", "pandas", "pyarrow", "pyarrow.*", "bm25s", "sklearn", "sklearn.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.coverage.run]
source = ["nlp_ranker"]
branch = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
